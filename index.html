<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PBMC Library | Platform Generation</title>
  <meta name="robots" content="noindex,follow">
  <script>
  (async function () {
    try {
      const response = await fetch('./library.json', { cache: 'no-store' });
      if (!response.ok) throw new Error('library.json unavailable');
      const library = await response.json();
      const first = (library.cases || []).find(function (item) {
        return item && item.status === 'published' && item.slug;
      });
      const slug = first ? first.slug : 'scalable-capital';
      window.location.replace('./' + encodeURIComponent(slug) + '/');
    } catch (error) {
      window.location.replace('./scalable-capital/');
    }
  }());
  </script>
  <noscript><meta http-equiv="refresh" content="0; url=./scalable-capital/"></noscript>
</head>
<body>
  <p>Opening the PBMC Library…</p>
</body>
</html>
